services:
  # Serena MCP (semantic code retrieval for AI tools)
  serena:
    build:
      context: .
      dockerfile: Dockerfile.serena
    container_name: lilt-serena
    restart: unless-stopped
    environment:
      - SERENA_DOCKER=1
    ports:
      - "10123:9121"   # SSE endpoint (non-standard to avoid cross-project conflicts)
      - "34284:24282"  # Web dashboard (non-standard to avoid cross-project conflicts)
    volumes:
      - .:/workspace/lilt
    command: >
      serena start-mcp-server
        --transport sse
        --port 9121
        --host 0.0.0.0
        --context desktop-app
        --project /workspace/lilt
    profiles:
      - serena
